name: Send Push Notification Email

on:
  push:
    branches:
      - '**'

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Send Mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          
          username: ${{ secrets.MAIL_RABIA }}
          password: ${{ secrets.MAIL_PASSWORD }}
          
          subject: "[PulseGuard] ${{ github.repository }} deposuna yeni push yapildi!"
          to: mert.ozturk@dataflowx.com
          from: "GitHub Bildirim <rabiaacalmuk@gmail.com>"
          
          html_body: |
            <h3>PulseGuard Projesine Yeni Push Yapildi!</h3>
            <p><b>Depo:</b> ${{ github.repository }}</p>
            <p><b>Branch:</b> ${{ github.ref_name }}</p>
            <p><b>Push Yapan:</b> ${{ github.actor }}</p>
            <p><b>Commit Mesaji:</b> ${{ github.event.head_commit.message }}</p>
            <p><a href="${{ github.event.head_commit.url }}">Commit'i GitHub'da İncele</a></p>